    \ arrearages. Please pick one of the following options:\n\nOption 1: A fixed dollar\
    \ amount of arrears is specified and agreed upon. That amount is reduced to judgment\
    \ and becomes immediately due and payable at the time of finalizing the dissolution.\n\
    \nOption 2: If the party is in arrears as of the date the case is submitted to\
    \ the Court, the Clerk\u2019s records will determine the amount. That amount is\
    \ reduced to judgment and becomes immediately payable.\n\nOption 3: Same as Option\
    \ 2, but adds preservation language: the Clerk-determined arrearage is reduced\
    \ to judgment and explicitly preserved and maintained.\n\nOption 4 (Kosciusko\
    \ County-specific): If the party is in arrears as of the date of finalization,\
    \ the arrearage is preserved in the final decree dissolving the marriage."
