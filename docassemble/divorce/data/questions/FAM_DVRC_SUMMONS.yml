code: multi_user = True
mandatory: true
---
features:
  css:
  - https://d34mmrz2ojoc57.cloudfront.net/documatecss.css
  question back button: true
  use catchall: true
---
modules:
- docassemble.base.util
- docassemble.numberstowords.numbers_to_words
- docassemble.commalist.commalist
- docassemble.mathops.math_ops
- documate.base.yaml_functions
---
metadata:
  sessions are unique: false
  short title: FAM_DVRC_SUMMONS
  title: FAM_DVRC_SUMMONS
---
code: |-
  from documate.base.yaml_functions import load_data_manager_variables
  load_data_manager_variables(url_args)
initial: true
---
code: |-
  court_name
  county_name
  case_number
  petitioner_name
  respondent_name
  respondent_street_address
  respondent_city_state_zip_code
  manner_of_service
  other_manner_of_service
  attorney_for_petitioner_name
  attorney_for_petitioner_address
  attorney_for_petitioner_phone_number
  acknowledgment_service_year
  return_service_mailed_day
  return_service_mailed_month
  return_service_received_day
  return_service_received_month
  return_service_dated
  service_day
  service_month
  person_served_at_residence
  not_found_day
  not_found_month
  summons_came_to_hand_day
  summons_came_to_hand_month
  hsl_review_answers
  hsl_final_screen
mandatory: true
question metadata:
  hsl interview order: true
---
fields:
- What is the name of the court?: court_name
  datatype: text
- What is the name of the county?: county_name
  datatype: text
- What is the case number?: case_number
  datatype: text
question: Case Information
---
fields:
- What is the name of the petitioner?: petitioner_name
  datatype: text
question: Petitioner Information
---
fields:
- What is the name of the respondent?: respondent_name
  datatype: text
- What is the street address of the respondent?: respondent_street_address
  datatype: text
- What are the city, state, and zip code of the respondent's address?: respondent_city_state_zip_code
  datatype: text
question: Respondent Information
---
fields:
- What manner of service is designated?: manner_of_service
  choices:
  - Registered Mail: Registered Mail
  - By Sheriff as provided by law: By Sheriff as provided by law
  - Certified Mail: Certified Mail
  - Other: Other
  datatype: dropdown
- What is the 'Other' manner of service?: other_manner_of_service
  datatype: text
  show if:
    is: Other
    variable: manner_of_service
question: Clerk's Issuance
validation code: |-
  if manner_of_service != 'Other':
    other_manner_of_service = ''
---
fields:
- What is the name of the attorney for petitioner?: attorney_for_petitioner_name
  datatype: text
- What is the address of the attorney for petitioner?: attorney_for_petitioner_address
  datatype: text
- What is the phone number of the attorney for petitioner?: attorney_for_petitioner_phone_number
  datatype: text
question: Attorney Information
---
fields:
- What is the year of the acknowledgment of service?: acknowledgment_service_year
  datatype: number
- What is the day (number) the summons was mailed (return of service)?: return_service_mailed_day
  datatype: number
- What is the month the summons was mailed (return of service)?: return_service_mailed_month
  datatype: text
- What is the day (number) the return receipt was received (return of service)?: return_service_received_day
  datatype: number
- What is the month the return receipt was received (return of service)?: return_service_received_month
  datatype: text
- What is the date for return of service of summons by mail?: return_service_dated
  datatype: date
- What is the day of service?: service_day
  datatype: number
- What is the month of service?: service_month
  datatype: text
- What is the name of the person of suitable age and discretion at the residence?: person_served_at_residence
  datatype: text
- What is the day the respondent was not found?: not_found_day
  datatype: number
- What is the month the respondent was not found?: not_found_month
  datatype: text
question: Return of Service
validation code: |-
  if not defined('return_service_dated') or not return_service_dated:
    return_service_dated = DAEmpty()
---
fields:
- What is the day the summons came to hand?: summons_came_to_hand_day
  datatype: number
- What is the month the summons came to hand?: summons_came_to_hand_month
  datatype: text
question: Service Details
---
field: hsl_review_answers
prevent going back: true
question: ${ word("Please review your answers below.") }
review:
- note: '####Case Information'
- Change Answer: court_name
  button: '**What is the name of the court?**: ${ court_name }'
- Change Answer: county_name
  button: '**What is the name of the county?**: ${ county_name }'
- Change Answer: case_number
  button: '**What is the case number?**: ${ case_number }'
- note: '####Petitioner Information'
- Change Answer: petitioner_name
  button: '**What is the name of the petitioner?**: ${ petitioner_name }'
- note: '####Respondent Information'
- Change Answer: respondent_name
  button: '**What is the name of the respondent?**: ${ respondent_name }'
- Change Answer: respondent_street_address
  button: '**What is the street address of the respondent?**: ${ respondent_street_address
    }'
- Change Answer: respondent_city_state_zip_code
  button: '**What are the city, state, and zip code of the respondent''s address?**:
    ${ respondent_city_state_zip_code }'
- note: '####Clerk''s Issuance'
- Change Answer: manner_of_service
  button: '**What manner of service is designated?**: ${ manner_of_service }'
- Change Answer: other_manner_of_service
  button: '**What is the ''Other'' manner of service?**: ${ other_manner_of_service
    }'
  show if: manner_of_service == 'Other'
- note: '####Attorney Information'
- Change Answer: attorney_for_petitioner_name
  button: '**What is the name of the attorney for petitioner?**: ${ attorney_for_petitioner_name
    }'
- Change Answer: attorney_for_petitioner_address
  button: '**What is the address of the attorney for petitioner?**: ${ attorney_for_petitioner_address
    }'
- Change Answer: attorney_for_petitioner_phone_number
  button: '**What is the phone number of the attorney for petitioner?**: ${ attorney_for_petitioner_phone_number
    }'
- note: '####Return of Service'
- Change Answer: acknowledgment_service_year
  button: '**What is the year of the acknowledgment of service?**: ${ acknowledgment_service_year
    }'
- Change Answer: return_service_mailed_day
  button: '**What is the day (number) the summons was mailed (return of service)?**:
    ${ return_service_mailed_day }'
- Change Answer: return_service_mailed_month
  button: '**What is the month the summons was mailed (return of service)?**: ${ return_service_mailed_month
    }'
- Change Answer: return_service_received_day
  button: '**What is the day (number) the return receipt was received (return of service)?**:
    ${ return_service_received_day }'
- Change Answer: return_service_received_month
  button: '**What is the month the return receipt was received (return of service)?**:
    ${ return_service_received_month }'
- Change Answer: return_service_dated
  button: '**What is the date for return of service of summons by mail?**: ${ return_service_dated
    }'
- Change Answer: service_day
  button: '**What is the day of service?**: ${ service_day }'
- Change Answer: service_month
  button: '**What is the month of service?**: ${ service_month }'
- Change Answer: person_served_at_residence
  button: '**What is the name of the person of suitable age and discretion at the
    residence?**: ${ person_served_at_residence }'
- Change Answer: not_found_day
  button: '**What is the day the respondent was not found?**: ${ not_found_day }'
- Change Answer: not_found_month
  button: '**What is the month the respondent was not found?**: ${ not_found_month
    }'
- note: '####Service Details'
- Change Answer: summons_came_to_hand_day
  button: '**What is the day the summons came to hand?**: ${ summons_came_to_hand_day
    }'
- Change Answer: summons_came_to_hand_month
  button: '**What is the month the summons came to hand?**: ${ summons_came_to_hand_month
    }'
skip undefined: false
---
code: completed_at = current_datetime()
