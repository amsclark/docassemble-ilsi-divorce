fields:
- Does visitation need to be supervised?: supervised_visitation
  datatype: yesnoradio
- What are the facts supporting the request that visitation be supervised?: facts_supporting_supervised_visitation
  datatype: area
  show if:
    is: true
    variable: supervised_visitation
- Is Petitioner asking for usage of the parties' vehicle?: asking_for_shared_vehicle
  datatype: yesnoradio
- What is the color, year, make and model of the vehicle?: car_make_model_year_color
  datatype: text
  show if:
    is: true
    variable: asking_for_shared_vehicle
question: Requested Relief
validation code: |-
  if supervised_visitation != True:
    facts_supporting_supervised_visitation = ''
  if asking_for_shared_vehicle != True:
    car_make_model_year_color = ''
