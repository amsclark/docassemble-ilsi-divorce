  certificate_service_name_of_person_served_iefs
  certificate_service_email_of_person_served_iefs
  certificate_service_date_served_mail
  certificate_service_mailing_address_of_person_served
  hsl_review_answers
  hsl_final_screen
mandatory: true
question metadata:
  hsl interview order: true
---
fields:
- What is the name of the court?: court_name
  datatype: text
- What is the case number?: case_number
  datatype: text
- What is the court county?: county_name
  datatype: text
- Are either petitioner or respondent members of the military?: military_member
  choices:
  - Petitioner: Petitioner
  - Respondent: Respondent
  - Both: Both
  - Neither: Neither
  datatype: dropdown
question: Court and Case Information
---
fields:
- What is the name of the petitioner?: petitioner_name
  datatype: text
- What pronouns are used to refer to the petitioner?: petitioner_pronoun
  choices:
  - Male: Male
  - Female: Female
  datatype: dropdown
- What is the role of the petitioner (husband, wife, or spouse)?: petitioner_role
  choices:
  - husband: husband
  - wife: wife
  - spouse: spouse
  datatype: dropdown
question: Petitioner Information
---
fields:
- What is the name of the respondent?: respondent_name
  datatype: text
- What is the street address of respondent: respondent_street_address
  datatype: text
- What is the city and state where the respondent resides?: respondent_residence_city_state
  datatype: text
- What pronouns are used to refer to respondent?: respondent_pronoun
  choices:
  - Male: Male
  - Female: Female
  datatype: dropdown
- What is the county where respondent resides: respondent_county
  datatype: text
- What is the respondent's zip code?: respondent_zip
  datatype: text
question: Respondent Information
---
fields:
- What is the date of marriage (month, day, and year)?: marriage_date
  datatype: date
- What is the date of separation (month, day, and year)?: separation_date
  datatype: date
- Did the parties acquire any property or debts during their marriage?: acquired_property_and_debts
  datatype: yesnoradio
question: Marriage and Separation Details
validation code: |-
  if not defined('marriage_date') or not marriage_date:
    marriage_date = DAEmpty()
  if not defined('separation_date') or not separation_date:
    separation_date = DAEmpty()
---
fields:
- Were any children born of the marriage?: minor_children_involved
  datatype: yesnoradio
- How many children have been born to the parties?: number_of_children
  datatype: integer
  show if:
    is: true
    variable: minor_children_involved
- Is either party pregnant?: pregnant
  datatype: yesnoradio
- Which party is pregnant?: which_pregnant
  choices:
  - Petitioner: Petitioner
  - Respondent: Respondent
  - Both: Both
  datatype: dropdown
question: Children Information
validation code: |-
  if minor_children_involved != True:
    number_of_children = 0
---
code: |-
  children_details[i].child_name
  children_details[i].child_birth_month_year
  children_details[i].currently_residing_with
field: children_details[i].hsl_complete
question metadata:
  hsl interview order: true
---
code: children_details.there_are_any = True
only sets:
- children_details.there_are_any
---
fields:
- Name of child: children_details[i].child_name
  datatype: text
- Month and year of childs birth: children_details[i].child_birth_month_year
  datatype: text
- Currently residing with: children_details[i].currently_residing_with
  choices:
  - Petitioner: Petitioner
  - Respondent: Respondent
  datatype: dropdown
list collect: not children_details.has_been_gathered()
question: Children Details
question metadata:
  hsl repeating item dataname: children_details
---
columns:
- Name of child: row_item.child_name
- Month and year of childs birth: row_item.child_birth_month_year
- Currently residing with: row_item.currently_residing_with
edit:
- child_name
rows: children_details
table: hsl_children_details_table
---
field: children_details.hsl_reviewed
prevent going back: true
question: ${ word("Please review your entries") }
subquestion: |-
  ## Children Details
  ${ hsl_children_details_table }
  ${ children_details.add_action() }
---
code: |-
  if not children_details.there_are_any:
    children_details.hsl_reviewed = True
depends on: children_details.there_are_any
field: hsl_repeating_question_logic_children_details
---
fields:
- Does the petitioner want their former name restored?: wants_name_changed
  datatype: yesnoradio
- What is the surname to be restored?: surname_to_be_restored
  datatype: text
  show if:
    is: true
    variable: wants_name_changed
question: Name Restoration
validation code: |-
  if wants_name_changed != True:
    surname_to_be_restored = ''
---
fields:
- What is the name of the law firm?: firm_name
  datatype: text
- What is the name of the attorney?: attorney_name
  datatype: text
- What is the attorney number?: attorney_number
  datatype: text
- What is the street address of the attorney?: attorney_street_address
  datatype: text
- What is the city, state, and zip code of the attorney?: attorney_city_state_zip
  datatype: text
- What is the phone number of the attorney?: attorney_phone_number
  datatype: text
- What is the email address of the attorney?: attorney_email_address
  datatype: email
- What is the printed name of the attorney for the certificate of service?: attorney_printed_name_certificate
  datatype: text
- What is the party role of the client (e.g., Petitioner)?: attorney_client_role
  datatype: text
question: Attorney Information
---
fields:
- What is the method of service?: service_method
  choices:
  - Electronic: Electronic
  - US Mail: US Mail
  datatype: dropdown
- What is the date the document was electronically filed?: certificate_service_date_filed
  datatype: date
  show if:
    is: Electronic
    variable: service_method
- What is the date the document was served by IEFS?: certificate_service_date_served_by_iefs
  datatype: date
  show if:
    is: Electronic
    variable: service_method
- What is the name of the person served by IEFS?: certificate_service_name_of_person_served_iefs
  datatype: text
  show if:
    is: Electronic
    variable: service_method
- What is the email address of the person served by IEFS?: certificate_service_email_of_person_served_iefs
  datatype: email
  show if:
    is: Electronic
    variable: service_method
- What is the date the document was served by mail?: certificate_service_date_served_mail
  datatype: date
  show if:
    is: US Mail
    variable: service_method
- What is the mailing address of the person served by mail?: certificate_service_mailing_address_of_person_served
  datatype: text
  show if:
    is: US Mail
    variable: service_method
question: Service of Documents
validation code: |-
  if not defined('certificate_service_date_filed') or not certificate_service_date_filed:
    certificate_service_date_filed = DAEmpty()
  if not defined('certificate_service_date_served_by_iefs') or not certificate_service_date_served_by_iefs:
    certificate_service_date_served_by_iefs = DAEmpty()
  if not defined('certificate_service_date_served_mail') or not certificate_service_date_served_mail:
    certificate_service_date_served_mail = DAEmpty()
  if service_method != 'Electronic':
    certificate_service_date_filed = DAEmpty()
  if service_method != 'Electronic':
    certificate_service_date_served_by_iefs = DAEmpty()
  if service_method != 'Electronic':
    certificate_service_name_of_person_served_iefs = ''
  if service_method != 'Electronic':
    certificate_service_email_of_person_served_iefs = ''
  if service_method != 'US Mail':
    certificate_service_date_served_mail = DAEmpty()
  if service_method != 'US Mail':
    certificate_service_mailing_address_of_person_served = ''
