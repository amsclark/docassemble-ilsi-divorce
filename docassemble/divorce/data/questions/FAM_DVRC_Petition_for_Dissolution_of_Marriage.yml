- docassemble.commalist.commalist
- docassemble.mathops.math_ops
- documate.base.yaml_functions
---
metadata:
  sessions are unique: false
  short title: FAM_DVRC_Petition_for_Dissolution_of_Marriage
  title: FAM_DVRC_Petition_for_Dissolution_of_Marriage
---
objects:
- children_details: DAList.using(object_type=DAObject,complete_attribute='hsl_complete',there_are_any=True)
---
code: |-
  from documate.base.yaml_functions import load_data_manager_variables
  load_data_manager_variables(url_args)
initial: true
---
code: |-
  court_name
  case_number
  county_name
  military_member
  petitioner_name
  petitioner_pronoun
  petitioner_role
  respondent_name
  respondent_street_address
  respondent_residence_city_state
  respondent_pronoun
  respondent_county
  respondent_zip
  marriage_date
  separation_date
  acquired_property_and_debts
