  choices:
  - Petitioner: Petitioner
  - Respondent: Respondent
  datatype: dropdown
  show if:
    is: true
    variable: a_party_had_a_name_change
- Do they want their former name restored?: party_wants_name_changed_back
  datatype: yesnoradio
  show if:
    is: true
    variable: a_party_had_a_name_change
