- Change Answer: judge_court_name
  button: '**What is the name of the court for the judge''s signature?**: ${ judge_court_name
    }'
- note: '####Attorney and Representation'
- Change Answer: petitioner_represented
  button: '**Is petitioner represented by counsel?**: ${ petitioner_represented }'
- Change Answer: petitioner_attorney_name
  button: '**What is the name of the petitioner''s attorney?**: ${ petitioner_attorney_name
    }'
