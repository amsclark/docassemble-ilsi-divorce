code: multi_user = True
mandatory: true
---
features:
  css:
  - https://d34mmrz2ojoc57.cloudfront.net/documatecss.css
  question back button: true
  use catchall: true
---
modules:
- docassemble.base.util
- docassemble.numberstowords.numbers_to_words
- docassemble.commalist.commalist
- docassemble.mathops.math_ops
- documate.base.yaml_functions
---
metadata:
  sessions are unique: false
  short title: FAM_DVRC_Order_Setting_Provisional_Hearing
  title: FAM_DVRC_Order_Setting_Provisional_Hearing
---
code: |-
  from documate.base.yaml_functions import load_data_manager_variables
  load_data_manager_variables(url_args)
initial: true
---
code: |-
  court_name
  county_name
  case_number
  petitioner_name
  respondent_name
  hearing_party
  hearing_date
  distribution_list
  so_ordered_date
  judge_title
  hsl_review_answers
  hsl_final_screen
mandatory: true
question metadata:
  hsl interview order: true
---
fields:
- What is the name of the court?: court_name
  datatype: text
- What is the name of the county?: county_name
  datatype: text
- What is the case number?: case_number
  datatype: text
question: Case Information
---
fields:
- What is the name of the petitioner?: petitioner_name
  datatype: text
- What is the name of the respondent?: respondent_name
  datatype: text
question: Party Information
---
fields:
- Who is the party requesting the hearing?: hearing_party
  choices:
  - Petitioner: Petitioner
  - Respondent: Respondent
  datatype: dropdown
- What date is the hearing date being set for?: hearing_date
  datatype: date
- List the Names of the Attorneys and pro se litigants who will receive a copy of the hearing order: distribution_list
  datatype: area
question: Hearing Details
validation code: |-
  if not defined('hearing_date') or not hearing_date:
    hearing_date = DAEmpty()
---
fields:
- What is the date the order was signed (SO ORDERED)?: so_ordered_date
  datatype: text
- What is the judge's title?: judge_title
  datatype: text
question: Judge Information
---
field: hsl_review_answers
prevent going back: true
question: ${ word("Please review your answers below.") }
review:
- note: '####Case Information'
- Change Answer: court_name
  button: '**What is the name of the court?**: ${ court_name }'
- Change Answer: county_name
  button: '**What is the name of the county?**: ${ county_name }'
- Change Answer: case_number
  button: '**What is the case number?**: ${ case_number }'
- note: '####Party Information'
- Change Answer: petitioner_name
  button: '**What is the name of the petitioner?**: ${ petitioner_name }'
- Change Answer: respondent_name
  button: '**What is the name of the respondent?**: ${ respondent_name }'
- note: '####Hearing Details'
- Change Answer: hearing_party
  button: '**Who is the party requesting the hearing?**: ${ hearing_party }'
- Change Answer: hearing_date
  button: '**What date is the hearing date being set for?**: ${ hearing_date }'
- Change Answer: distribution_list
  button: '**List the Names of the Attorneys and pro se litigants who will receive
    a copy of the hearing order**: ${ distribution_list }'
- note: '####Judge Information'
- Change Answer: so_ordered_date
  button: '**What is the date the order was signed (SO ORDERED)?**: ${ so_ordered_date
    }'
- Change Answer: judge_title
  button: '**What is the judge''s title?**: ${ judge_title }'
skip undefined: false
---
code: completed_at = current_datetime()
