code: |-
  from documate.base.yaml_functions import load_data_manager_variables
  load_data_manager_variables(url_args)
initial: true
---
code: |-
  court_name
  county_name
  case_number
  agreement_title
  petitioner_name
  respondent_name
  respondent_service_date
  firm_name
  petitioner_counsel_name
  respondent_counsel_name
  petitioner_counsel_attorney_number
  respondent_counsel_attorney_number
  hsl_review_answers
  hsl_final_screen
mandatory: true
question metadata:
  hsl interview order: true
---
fields:
- What is the name of the court?: court_name
  datatype: text
- What is the name of the county?: county_name
  datatype: text
- What is the case number?: case_number
  datatype: text
- What is the title of the agreement?: agreement_title
  choices:
  - Agreement Regarding Settlement of Property and Debts: Agreement Regarding Settlement
      of Property and Debts
  - Agreement Regarding Settlement of Property and Debts and Custody and Support of Minor Children: Agreement
      Regarding Settlement of Property and Debts and Custody and Support of Minor
      Children
  datatype: dropdown
question: Court and Case Information
---
fields:
- What is the name of the petitioner?: petitioner_name
  datatype: text
- What is the name of the respondent?: respondent_name
  datatype: text
question: Party Information
---
fields:
- On what date was the petition filed and served to the respondent?: respondent_service_date
  datatype: date
question: Service and Filing Details
validation code: |-
  if not defined('respondent_service_date') or not respondent_service_date:
    respondent_service_date = DAEmpty()
---
fields:
- What is the name of the law firm?: firm_name
  datatype: text
  required: false
- What is the name of the petitioner's counsel?: petitioner_counsel_name
  datatype: text
  required: false
- What is the name of the respondent's counsel?: respondent_counsel_name
  datatype: text
- What is the attorney number of the petitioner's counsel?: petitioner_counsel_attorney_number
  datatype: text
  required: false
- What is the attorney number of the respondent's counsel?: respondent_counsel_attorney_number
  datatype: text
  required: false
question: Attorney Information
---
field: hsl_review_answers
prevent going back: true
question: ${ word("Please review your answers below.") }
review:
- note: '####Court and Case Information'
- Change Answer: court_name
  button: '**What is the name of the court?**: ${ court_name }'
- Change Answer: county_name
  button: '**What is the name of the county?**: ${ county_name }'
- Change Answer: case_number
  button: '**What is the case number?**: ${ case_number }'
- Change Answer: agreement_title
  button: '**What is the title of the agreement?**: ${ agreement_title }'
- note: '####Party Information'
- Change Answer: petitioner_name
  button: '**What is the name of the petitioner?**: ${ petitioner_name }'
- Change Answer: respondent_name
  button: '**What is the name of the respondent?**: ${ respondent_name }'
- note: '####Service and Filing Details'
- Change Answer: respondent_service_date
  button: '**On what date was the petition filed and served to the respondent?**:
    ${ respondent_service_date }'
- note: '####Attorney Information'
- Change Answer: firm_name
  button: '**What is the name of the law firm?**: ${ firm_name }'
- Change Answer: petitioner_counsel_name
  button: '**What is the name of the petitioner''s counsel?**: ${ petitioner_counsel_name
    }'
- Change Answer: respondent_counsel_name
  button: '**What is the name of the respondent''s counsel?**: ${ respondent_counsel_name
    }'
- Change Answer: petitioner_counsel_attorney_number
  button: '**What is the attorney number of the petitioner''s counsel?**: ${ petitioner_counsel_attorney_number
    }'
- Change Answer: respondent_counsel_attorney_number
  button: '**What is the attorney number of the respondent''s counsel?**: ${ respondent_counsel_attorney_number
    }'
skip undefined: false
---
code: completed_at = current_datetime()
