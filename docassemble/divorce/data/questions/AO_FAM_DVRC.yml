- Change Answer: number_of_children
  button: '**How many minor children are involved?**: ${ number_of_children }'
- Change Answer: separation
  button: '**Does the case involve a legal separation?**: ${ separation }'
- Change Answer: case_type_petitioner
  button: '**Is the client the petitioner?**: ${ case_type_petitioner }'
- Change Answer: property_or_debt
  button: '**Are there any marital properties or debts to be divided?**: ${ property_or_debt
    }'
- Change Answer: hbp_referral
  button: '**Is this case being referred to the Heartland Pro Bono Project?**: ${
    hbp_referral }'
  show if: county == 'Marion'
- Change Answer: income_disparity
  button: '**Is there a significant income disparity between the spouses where the
    client is unemployed/underemployed?**: ${ income_disparity }'
  show if: county == 'Marion'
- Change Answer: international
  button: '**Is the party that needs to be served in another country?**: ${ international
    }'
- Change Answer: military
  button: '**Is the party that needs to be served in the military?**: ${ military
    }'
- Change Answer: publication
  button: '**Does the respondent need to be served by publication?**: ${ publication
    }'
- Change Answer: same_sex
  button: '**Does this case involve a same-sex marriage?**: ${ same_sex }'
- Change Answer: pregnant
  button: '**Is either party pregnant?**: ${ pregnant }'
- Change Answer: abuse
  button: '**Does the case involve abuse?**: ${ abuse }'
- Change Answer: spouse_location
  button: '**What is their specific location (e.g., Nigeria, Germany, Mexico)?**:
    ${ spouse_location }'
  show if: international == True
- Change Answer: spouse_location_has_treaty
  button: '**If the spouse is in a foreign country, does that country have a child
    support treaty with the U.S.?**: ${ spouse_location_has_treaty }'
  show if: international == True
- Change Answer: local_dv_agency
  button: '**If abuse is a factor, what is the name and contact information for the
    local domestic violence agency?**: ${ local_dv_agency }'
  show if: abuse == True
- Change Answer: county_prosecutor_office_name
  button: '**What is the name of the county prosecutor''s office?**: ${ county_prosecutor_office_name
    }'
  show if: minor_children_involved == True
- Change Answer: prosecutor_office_address
  button: '**What is the address of the county prosecutor''s office?**: ${ prosecutor_office_address
    }'
  show if: minor_children_involved == True
- Change Answer: prosecutor_office_phone_number
  button: '**What is the phone number of the county prosecutor''s office?**: ${ prosecutor_office_phone_number
    }'
  show if: minor_children_involved == True
- Change Answer: wants_name_change
  button: '**Does the client wish to change their name as part of the divorce?**:
    ${ wants_name_change }'
- Change Answer: county_clerk_county_name
  button: '**What is the name of the county for the clerk''s office?**: ${ county_clerk_county_name
    }'
skip undefined: false
