code: multi_user = True
mandatory: true
---
features:
  css:
  - https://d34mmrz2ojoc57.cloudfront.net/documatecss.css
  question back button: true
  use catchall: true
---
modules:
- docassemble.base.util
- docassemble.numberstowords.numbers_to_words
- docassemble.commalist.commalist
- docassemble.mathops.math_ops
- documate.base.yaml_functions
---
metadata:
  sessions are unique: false
  short title: AO_FAM_DVRC
  title: AO_FAM_DVRC
---
code: |-
  from documate.base.yaml_functions import load_data_manager_variables
  load_data_manager_variables(url_args)
initial: true
---
code: |-
  letter_date
  recipient_name
  recipient_address
  recipient_email
  sender_name
  sender_title
  sender_email
  case_specific_facts
  recipient_salutation
  recipient_last_name
  county
  minor_children_involved
  number_of_children
  separation
  case_type_petitioner
  property_or_debt
  hbp_referral
  income_disparity
  international
  military
  publication
  same_sex
  pregnant
  abuse
  spouse_location
  spouse_location_has_treaty
  local_dv_agency
  county_prosecutor_office_name
  prosecutor_office_address
  prosecutor_office_phone_number
  wants_name_change
  county_clerk_county_name
  hsl_review_answers
  hsl_final_screen
mandatory: true
question metadata:
  hsl interview order: true
---
fields:
- What is the date for the letter?: letter_date
  datatype: date
- What is the recipient's full name?: recipient_name
  datatype: text
- What is the recipient's full mailing address?: recipient_address
  datatype: area
- What is the recipient's email address? (Optional): recipient_email
  datatype: text
  required: false
- What is the sender's full name?: sender_name
  datatype: text
- What is the sender's title (e.g., Attorney at Law)?: sender_title
  datatype: text
- What is the sender's email?: sender_email
  datatype: text
- Please provide a brief, one-paragraph summary of the client's specific situation.: case_specific_facts
  datatype: area
- What is the recipient's salutation?: recipient_salutation
  datatype: text
- What is the recipient's last name?: recipient_last_name
  datatype: text
question: Template Selection and General Information
validation code: |-
  if not defined('letter_date') or not letter_date:
    letter_date = DAEmpty()
---
fields:
- In which Indiana county is the case being filed?: county
  choices:
  - Allen: Allen
  - Bartholomew: Bartholomew
  - Clark: Clark
  - Delaware: Delaware
  - Elkhart: Elkhart
  - Hamilton: Hamilton
  - Johnson: Johnson
  - Lake: Lake
  - Lawrence: Lawrence
  - Marion: Marion
  - Monroe: Monroe
  - Other: Other
  datatype: dropdown
- Are minor children involved?: minor_children_involved
  datatype: yesnoradio
- How many minor children are involved?: number_of_children
  datatype: text
- Does the case involve a legal separation?: separation
  datatype: yesnoradio
- Is the client the petitioner?: case_type_petitioner
  datatype: yesnoradio
- Are there any marital properties or debts to be divided?: property_or_debt
  datatype: yesnoradio
- Is this case being referred to the Heartland Pro Bono Project?: hbp_referral
  datatype: yesnoradio
  show if:
    is: Marion
    variable: county
- Is there a significant income disparity between the spouses where the client is unemployed/underemployed?: income_disparity
  datatype: yesnoradio
  show if:
    is: Marion
    variable: county
- Is the party that needs to be served in another country?: international
  datatype: yesnoradio
- Is the party that needs to be served in the military?: military
  datatype: yesnoradio
- Does the respondent need to be served by publication?: publication
  datatype: yesnoradio
- Does this case involve a same-sex marriage?: same_sex
  datatype: yesnoradio
- Is either party pregnant?: pregnant
  datatype: yesnoradio
- Does the case involve abuse?: abuse
  datatype: yesnoradio
- What is their specific location (e.g., Nigeria, Germany, Mexico)?: spouse_location
  datatype: text
  show if:
    is: true
    variable: international
- If the spouse is in a foreign country, does that country have a child support treaty with the U.S.?: spouse_location_has_treaty
  datatype: yesnoradio
  show if:
    is: true
    variable: international
- If abuse is a factor, what is the name and contact information for the local domestic violence agency?: local_dv_agency
  datatype: area
  show if:
    is: true
    variable: abuse
- What is the name of the county prosecutor's office?: county_prosecutor_office_name
  datatype: text
  show if:
    is: true
    variable: minor_children_involved
- What is the address of the county prosecutor's office?: prosecutor_office_address
  datatype: area
  show if:
    is: true
    variable: minor_children_involved
- What is the phone number of the county prosecutor's office?: prosecutor_office_phone_number
  datatype: text
  show if:
    is: true
    variable: minor_children_involved
- Does the client wish to change their name as part of the divorce?: wants_name_change
  datatype: yesnoradio
- What is the name of the county for the clerk's office?: county_clerk_county_name
  datatype: text
question: Detail Questions
validation code: |-
  if county != 'Marion':
    hbp_referral = ''
  if county != 'Marion':
    income_disparity = ''
  if international != True:
    spouse_location = ''
  if international != True:
    spouse_location_has_treaty = ''
  if abuse != True:
    local_dv_agency = ''
  if minor_children_involved != True:
    county_prosecutor_office_name = ''
  if minor_children_involved != True:
    prosecutor_office_address = ''
  if minor_children_involved != True:
    prosecutor_office_phone_number = ''
---
field: hsl_review_answers
prevent going back: true
question: ${ word("Please review your answers below.") }
review:
- note: '####Template Selection and General Information'
- Change Answer: letter_date
  button: '**What is the date for the letter?**: ${ letter_date }'
- Change Answer: recipient_name
