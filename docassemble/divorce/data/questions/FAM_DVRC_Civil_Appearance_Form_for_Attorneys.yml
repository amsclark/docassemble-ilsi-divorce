---
metadata:
  sessions are unique: false
  short title: FAM_DVRC_Civil_Appearance_Form_for_Attorneys
  title: FAM_DVRC_Civil_Appearance_Form_for_Attorneys
---
code: |-
  from documate.base.yaml_functions import load_data_manager_variables
  load_data_manager_variables(url_args)
initial: true
---
code: |-
  court_name
  county_name
  case_number
  petitioner_name
  respondent_name
  initiating_responding_or_intervening
  name_of_party_attorney_appearing_for
  phone_of_party_attorney_appearing_for
  address_of_party_attorney_appearing_for
  attorney_name
  attorney_number
  firm_name
  firm_mailing_address
  attorney_phone
  attorney_fax
  attorney_email
  person_served_name
  electronically_or_mail
  person_served_email
  person_served_postal_mail_address
  mail_served_date
  electronic_filing_date
  date_served_by_IEFS
  case_type
  is_child_support_case
  hsl_review_answers
  hsl_final_screen
mandatory: true
question metadata:
  hsl interview order: true
---
fields:
- What is the name of the court?: court_name
  datatype: text
- What is the name of the county?: county_name
  datatype: text
- What is the case number (if it has been assigned by the Clerk): case_number
  datatype: text
  required: false
question: Court Information
---
fields:
- What is the name of the petitioner?: petitioner_name
  datatype: text
- What is the name of the respondent?: respondent_name
  datatype: text
- 'The party on whose behalf the appearance form is being filed is: ': initiating_responding_or_intervening
  choices:
  - Initiating: Initiating
  - Responding: Responding
  - Intervening: Intervening
  datatype: dropdown
- What is the name of the party for whom the attorney is entering an appearance?: name_of_party_attorney_appearing_for
  datatype: text
- What is the phone number of the party for whom the attorney is entering an appearance?: phone_of_party_attorney_appearing_for
  datatype: area
- What is the address of the party for whom the attorney is entering an appearance?: address_of_party_attorney_appearing_for
  datatype: area
question: Party Information
---
fields:
- What is the name of the attorney?: attorney_name
  datatype: text
- What is the attorney's bar number?: attorney_number
  datatype: text
- What is the name of the attorney's firm?: firm_name
  datatype: text
- What is the mailing address of the attorney's firm?: firm_mailing_address
  datatype: area
- What is the attorney's phone number?: attorney_phone
  datatype: text
- What is the attorney's fax number?: attorney_fax
  datatype: text
- What is the attorney's email address?: attorney_email
  datatype: email
question: Attorney Information
---
fields:
- What is the name of the person served in the Certificate of Service?: person_served_name
  datatype: text
- For the certificate of service, will the other party be served electronically or by mail?: electronically_or_mail
  choices:
  - Electronically: Electronically
  - Mail: Mail
  datatype: dropdown
- What is the email address of the party served?: person_served_email
  datatype: email
  show if:
    is: Electronically
    variable: electronically_or_mail
- What is the mailing address of the person served?: person_served_postal_mail_address
  datatype: area
  show if:
    is: Mail
    variable: electronically_or_mail
- What is the date served by mail?: mail_served_date
  datatype: date
  show if:
    is: Mail
    variable: electronically_or_mail
- What date was the appearance filed electronically?: electronic_filing_date
  datatype: date
  show if:
    is: Electronically
    variable: electronically_or_mail
- What date was the appearance served via IEFS on the other party?: date_served_by_IEFS
  datatype: date
  show if:
    is: Electronically
    variable: electronically_or_mail
question: Legal Service Details
validation code: |-
  if not defined('mail_served_date') or not mail_served_date:
    mail_served_date = DAEmpty()
  if not defined('electronic_filing_date') or not electronic_filing_date:
    electronic_filing_date = DAEmpty()
  if not defined('date_served_by_IEFS') or not date_served_by_IEFS:
    date_served_by_IEFS = DAEmpty()
  if electronically_or_mail != 'Electronically':
    person_served_email = ''
  if electronically_or_mail != 'Mail':
    person_served_postal_mail_address = ''
  if electronically_or_mail != 'Mail':
    mail_served_date = DAEmpty()
  if electronically_or_mail != 'Electronically':
    electronic_filing_date = DAEmpty()
  if electronically_or_mail != 'Electronically':
    date_served_by_IEFS = DAEmpty()
---
fields:
- What is the case type? (DC - Domestic Relations with Children; DN - Domestic Relations without Children): case_type
  choices:
  - DC: DC
  - DN: DN
  datatype: dropdown
- Is this a child support case?: is_child_support_case
  datatype: yesnoradio
question: Case Type and Details
---
field: hsl_review_answers
prevent going back: true
question: ${ word("Please review your answers below.") }
review:
- note: '####Court Information'
- Change Answer: court_name
  button: '**What is the name of the court?**: ${ court_name }'
- Change Answer: county_name
  button: '**What is the name of the county?**: ${ county_name }'
- Change Answer: case_number
  button: '**What is the case number (if it has been assigned by the Clerk)**: ${
    case_number }'
- note: '####Party Information'
- Change Answer: petitioner_name
  button: '**What is the name of the petitioner?**: ${ petitioner_name }'
- Change Answer: respondent_name
  button: '**What is the name of the respondent?**: ${ respondent_name }'
- Change Answer: initiating_responding_or_intervening
  button: '**The party on whose behalf the appearance form is being filed is: **:
    ${ initiating_responding_or_intervening }'
- Change Answer: name_of_party_attorney_appearing_for
  button: '**What is the name of the party for whom the attorney is entering an appearance?**:
    ${ name_of_party_attorney_appearing_for }'
- Change Answer: phone_of_party_attorney_appearing_for
  button: '**What is the phone number of the party for whom the attorney is entering
    an appearance?**: ${ phone_of_party_attorney_appearing_for }'
- Change Answer: address_of_party_attorney_appearing_for
  button: '**What is the address of the party for whom the attorney is entering an
    appearance?**: ${ address_of_party_attorney_appearing_for }'
- note: '####Attorney Information'
- Change Answer: attorney_name
  button: '**What is the name of the attorney?**: ${ attorney_name }'
- Change Answer: attorney_number
  button: '**What is the attorney''s bar number?**: ${ attorney_number }'
- Change Answer: firm_name
  button: '**What is the name of the attorney''s firm?**: ${ firm_name }'
- Change Answer: firm_mailing_address
  button: '**What is the mailing address of the attorney''s firm?**: ${ firm_mailing_address
    }'
- Change Answer: attorney_phone
  button: '**What is the attorney''s phone number?**: ${ attorney_phone }'
- Change Answer: attorney_fax
  button: '**What is the attorney''s fax number?**: ${ attorney_fax }'
- Change Answer: attorney_email
  button: '**What is the attorney''s email address?**: ${ attorney_email }'
- note: '####Legal Service Details'
- Change Answer: person_served_name
  button: '**What is the name of the person served in the Certificate of Service?**:
    ${ person_served_name }'
- Change Answer: electronically_or_mail
  button: '**For the certificate of service, will the other party be served electronically
    or by mail?**: ${ electronically_or_mail }'
- Change Answer: person_served_email
  button: '**What is the email address of the party served?**: ${ person_served_email
    }'
  show if: electronically_or_mail == 'Electronically'
- Change Answer: person_served_postal_mail_address
  button: '**What is the mailing address of the person served?**: ${ person_served_postal_mail_address
    }'
  show if: electronically_or_mail == 'Mail'
- Change Answer: mail_served_date
  button: '**What is the date served by mail?**: ${ mail_served_date }'
  show if: electronically_or_mail == 'Mail'
- Change Answer: electronic_filing_date
  button: '**What date was the appearance filed electronically?**: ${ electronic_filing_date
    }'
  show if: electronically_or_mail == 'Electronically'
- Change Answer: date_served_by_IEFS
  button: '**What date was the appearance served via IEFS on the other party?**: ${
    date_served_by_IEFS }'
  show if: electronically_or_mail == 'Electronically'
- note: '####Case Type and Details'
- Change Answer: case_type
  button: '**What is the case type? (DC - Domestic Relations with Children; DN - Domestic
    Relations without Children)**: ${ case_type }'
- Change Answer: is_child_support_case
  button: '**Is this a child support case?**: ${ is_child_support_case }'
skip undefined: false
